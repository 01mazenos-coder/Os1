{% extends "base.html" %}
{% block body %}
<header class="top"><div class="in">
  <a class="brand" href="{{ url_for('admin_dashboard') }}">Kart Yönetim Paneli</a>
  <form method="post" action="{{ url_for('admin_logout') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <button class="btn ghost small" type="submit">Çıkış</button>
  </form>
</div></header>
<main>
  {% for category, msg in get_flashed_messages(with_categories=true) %}
    <div class="alert {{ category }}" role="status">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
{% endblock %}
