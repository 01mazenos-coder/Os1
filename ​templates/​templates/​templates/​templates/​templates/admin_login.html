{% extends "base.html" %}
{% block title %}Yönetici Girişi{% endblock %}
{% block body %}
<div class="center">
  <form class="panel" method="post">
    <h1>Yönetim Paneli</h1>
    <p class="muted">Kartları yönetmek için giriş yapın.</p>
    {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="password">Şifre</label>
    <input id="password" class="ltr" type="password" name="password" autocomplete="current-password" required autofocus>
    <button class="btn block" type="submit">Giriş yap</button>
  </form>
</div>
{% endblock %}
