<!doctype html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Akıllı Kartlar{% endblock %}</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #fff; --text: #1b1f27; --muted: #667085; --line: #e4e7ec;
    --brand: #2459e6; --brand-ink: #fff; --ok: #12805c; --ok-bg: #e3f6ee;
    --warn: #a15c00; --warn-bg: #fff1d6; --bad: #b42318; --bad-bg: #fde8e6; --off: #475467; --off-bg: #eceff3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --surface: #1b2028; --text: #eef1f6; --muted: #98a2b3; --line: #2b323d;
      --brand: #6b93ff; --brand-ink: #0b1020; --ok: #4fd1a1; --ok-bg: #12342a;
      --warn: #f5b84a; --warn-bg: #3a2c0e; --bad: #ff8b7e; --bad-bg: #3d1a17; --off: #b4bdcb; --off-bg: #272d37; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  a { color: var(--brand); }
  .center { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px;
    width: 100%; max-width: 460px; }
  h1 { font-size: 1.35rem; margin: 0 0 8px; } h2 { font-size: 1.05rem; margin: 0 0 12px; }
  p { margin: 0 0 14px; } .muted { color: var(--muted); font-size: .9rem; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input[type=text], input[type=url], input[type=password], input[type=number], select {
    width: 100%; padding: 11px 12px; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; }
  input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .ltr { direction: ltr; text-align: left; }
  .btn { display: inline-block; border: 0; border-radius: 10px; padding: 11px 18px; font: inherit; font-weight: 600;
    background: var(--brand); color: var(--brand-ink); cursor: pointer; text-decoration: none; }
  .btn.block { width: 100%; margin-top: 18px; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: var(--bad-bg); color: var(--bad); }
  .btn.small { padding: 6px 12px; font-size: .88rem; }
  .alert { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: .95rem; }
  .alert.error { background: var(--bad-bg); color: var(--bad); }
  .alert.ok { background: var(--ok-bg); color: var(--ok); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
  .badge.active { background: var(--ok-bg); color: var(--ok); }
  .badge.inactive { background: var(--warn-bg); color: var(--warn); }
  .badge.disabled { background: var(--off-bg); color: var(--off); }
  code, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; direction: ltr; unicode-bidi: embed; }
  /* admin layout */
  header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
  header.top .in { max-width: 1100px; margin: auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header.top a.brand { font-weight: 700; text-decoration: none; color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .stat b { display: block; font-size: 1.6rem; line-height: 1.2; } .stat span { color: var(--muted); font-size: .88rem; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .row > div { flex: 1 1 160px; } .row label { margin-top: 0; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .93rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; }
  td.url { max-width: 280px; overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: left; }
  .pager { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 16px; }
  .qr { background: #fff; padding: 10px; border-radius: 12px; width: 190px; height: 190px; border: 1px solid var(--line); }
  .linkbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .linkbox code { background: var(--bg); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); word-break: break-all; }
  ul.hints { padding-inline-start: 18px; margin: 8px 0 0; } ul.hints li { margin: 2px 0; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
